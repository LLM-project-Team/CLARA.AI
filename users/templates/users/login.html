{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Container */
        .mobile-container {
            width: 375px;
            height: 812px;
            /* Django Static Image Loading */
            background-image: url("{% static 'images/yellow.jpg' %}");
            background-size: cover;
            background-position: center;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            padding: 40px 30px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Header Text */
        .header {
            margin-top: 130px;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 36px;
            color: #1a1a1a;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 16px;
            color: #1a1a1a;
            font-weight: 400;
        }

        /* Input Styling */
        .input-group {
            background: white;
            border-radius: 50px;
            padding: 12px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .input-group i {
            font-size: 18px;
            color: #333;
            margin-right: 15px;
            width: 20px;
            text-align: center;
        }

        .input-group input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            width: 100%;
            color: #333;
            font-weight: 500;
        }

        .input-group input::placeholder {
            color: #333;
            font-weight: 600;
        }

        /* Arrow Button */
        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .arrow-btn {
            background-color: black;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .arrow-btn:hover {
            transform: scale(1.1);
        }

        /* Footer */
        .footer {
            margin-top: auto;
            text-align: center;
            padding-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .footer input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: black;
        }

        .footer label {
            font-size: 12px;
            color: #1a1a1a;
            font-weight: 500;
            cursor: pointer;
        }

        /* Error Message Styling (Optional for Django) */
        .error-msg {
            color: red;
            font-size: 12px;
            text-align: center;
            margin-bottom: 10px;
        }

    </style>
</head>
<body>

    <div class="mobile-container">

        <div class="header">
            <h1>Welcome!</h1>
            <p>Sign in to Continue</p>
        </div>

        <form method="POST" action="">
            {% csrf_token %}

            {% if form.errors %}
                <div class="error-msg">
                    <p>Invalid Email or Password.</p>
                </div>
            {% endif %}

            <div class="input-group">
                <i class="fa-regular fa-envelope"></i> <input type="email" name="username" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i> <input type="password" name="password" placeholder="Password" required>
            </div>

            <div class="btn-container">
                <button type="submit" class="arrow-btn">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <input type="hidden" name="next" value="{{ next }}">

        </form>



    </div>

</body>
</html>
