<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAdmin | Secure Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            color: white;
            text-align: center;
        }

        .input-group { position: relative; margin-bottom: 20px; text-align: left; }

        .input-group i {
            position: absolute; left: 15px; top: 50%;
            transform: translateY(-50%); color: rgba(255, 255, 255, 0.7);
        }

        .input-group input {
            width: 100%; padding: 12px 15px 12px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px; color: white; outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder { color: rgba(255, 255, 255, 0.7); }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .login-btn {
            width: 100%; padding: 12px;
            background: white; color: #e73c7e;
            border: none; border-radius: 10px;
            font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 style="margin-bottom: 10px;">Welcome Back</h2>
        <p style="opacity: 0.8; margin-bottom: 30px;">Login to access the dashboard</p>

        <form method="POST" action="">
            {% csrf_token %}

            {% if form.errors %}
                <div style="background: rgba(255,0,0,0.2); border-radius: 8px; padding: 10px; margin-bottom: 15px; font-size: 0.9rem;">
                    <i class="fa-solid fa-circle-exclamation"></i> Invalid Email or Password
                </div>
            {% endif %}

            <div class="input-group">
                <input type="email" name="username" placeholder="Email Address" required autofocus>
                <i class="fa-regular fa-envelope"></i>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
                <i class="fa-solid fa-lock"></i>
            </div>

            <button type="submit" class="login-btn">
                Sign In <i class="fa-solid fa-arrow-right"></i>
            </button>

            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>

</body>
</html>
