<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin AI | Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'ui-sans-serif', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

    <!-- Soft blurred background orbs -->
    <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] rounded-full bg-gradient-to-br from-indigo-300 to-teal-200 opacity-25 blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-[-15%] right-[-5%] w-[500px] h-[500px] rounded-full bg-gradient-to-tr from-violet-300 to-sky-200 opacity-20 blur-3xl pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-md">
        <!-- Brand -->
        <div class="flex items-center justify-center gap-3 mb-10">
            <div class="w-11 h-11 bg-indigo-500 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-graduation-cap text-white text-sm"></i>
            </div>
            <span class="text-slate-800 text-xl font-extrabold tracking-tight">Admin AI</span>
        </div>

        <!-- Login card -->
        <div class="bg-white rounded-3xl border border-slate-100 shadow-xl shadow-slate-200/50 p-10 md:p-12">
            <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-2">Welcome back</h2>
            <p class="text-slate-500 text-sm mb-10">Sign in to access the dashboard</p>

            <form method="POST" action="">
                {% csrf_token %}

                {% if form.errors %}
                <div class="flex items-center gap-3 bg-red-50 border border-red-100 text-red-600 rounded-2xl px-5 py-4 mb-8 text-sm font-medium">
                    <i class="fa-solid fa-circle-exclamation text-red-400"></i>
                    Invalid email or password
                </div>
                {% endif %}

                <div class="space-y-5 mb-8">
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="email" name="username" placeholder="Email address" required autofocus
                               class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 text-sm placeholder:text-slate-400 focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 transition-all duration-200">
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="password" name="password" placeholder="Password" required
                               class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 text-sm placeholder:text-slate-400 focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 transition-all duration-200">
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-4 bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-sm rounded-2xl transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-indigo-500/30 flex items-center justify-center gap-2">
                    Sign In <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>

                <input type="hidden" name="next" value="{{ next }}">
            </form>
        </div>

        <p class="text-center text-slate-400 text-xs mt-8">Academic Administration System &middot; Powered by AI</p>
    </div>

</body>
</html>
