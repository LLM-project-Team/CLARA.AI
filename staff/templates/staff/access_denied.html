{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-20 px-6 text-center">
    <!-- Icon -->
    <div class="w-24 h-24 rounded-full bg-red-50 border border-red-100 flex items-center justify-center mb-8">
        <i class="fa-solid fa-lock text-red-400 text-4xl"></i>
    </div>

    <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-3">Access Denied</h2>
    <p class="text-slate-500 text-sm max-w-sm mb-10 leading-relaxed">
        {{ message|default:"You don't have permission to access this page. Please contact your administrator if you believe this is an error." }}
    </p>

    <a href="{% url 'pages:home' %}"
       class="inline-flex items-center gap-2 px-8 py-4 bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-bold rounded-2xl transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-indigo-500/30">
        <i class="fa-solid fa-home text-xs"></i> Back to Dashboard
    </a>
</div>
{% endblock %}
